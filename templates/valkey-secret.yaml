{{- $secretName := .Values.valkey.secret.name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "valkey-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
type: Opaque
data:
  # Generated once and kept stable across `helm upgrade` via a lookup of the
  # existing secret, so the password is never written into git.
  password: {{ if $existing }}{{ index $existing.data "password" }}{{ else }}{{ randAlphaNum 24 | b64enc }}{{ end }}
