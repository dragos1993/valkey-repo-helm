{{- if .Values.valkey.imagePullSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.valkey.imagePullSecret.name }}
  labels:
    {{- include "valkey-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
type: kubernetes.io/dockerconfigjson
data:
  # Pass the real value at install time, e.g.:
  #   helm upgrade --install ... \
  #     --set valkey.imagePullSecret.create=true \
  #     --set-file valkey.imagePullSecret.dockerconfigjson=./auth.json
  # Never commit real registry credentials into values files.
  .dockerconfigjson: {{ .Values.valkey.imagePullSecret.dockerconfigjson | b64enc }}
{{- end }}
